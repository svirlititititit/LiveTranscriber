name: LiveTranscriber
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
targets:
  LiveTranscriber:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Sources/LessonCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.livetranscriber.app
        PRODUCT_NAME: LiveTranscriber
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Config/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        DEVELOPMENT_TEAM: ""
schemes:
  LiveTranscriber:
    build:
      targets:
        LiveTranscriber: all
    run:
      config: Debug
    archive:
      config: Release
